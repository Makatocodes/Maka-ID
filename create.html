<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create ID - MyWallet PH</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

body{
background:#f8fafc;
}

.id-card-container{
perspective:1000px;
}

.id-card{
width:100%;
height:220px;
position:relative;
transform-style:preserve-3d;
transition:.7s;
}

.id-card.flipped{
transform:rotateY(180deg);
}

.front,
.back{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
border-radius:16px;
overflow:hidden;
background:#e2e8f0;
}

.back{
transform:rotateY(180deg);
}

.front img,
.back img{
width:100%;
height:100%;
object-fit:cover;
}
.hidden{
display:none;
}

#frontPreview,
#backPreview{
display:block;
width:100%;
height:100%;
object-fit:cover;
}

.id-card{
background:#cbd5e1;
}
</style>

</head>

<body class="bg-slate-50 font-sans">

<div class="max-w-md mx-auto pb-20">

    <!-- HEADER -->
    <div class="bg-white p-4 shadow-sm flex items-center sticky top-0 z-50">

        <button type="button"
            onclick="location.href='index.html'"
            class="w-10 h-10 rounded-full bg-slate-100">

            <i class="fa-solid fa-arrow-left"></i>

        </button>
        <h2 class="font-bold text-lg ml-4">
            Create ID
        </h2>

    </div>

    <!-- SELECT OPTION SCREEN -->

    <div id="selectOption" class="p-4">

        <h3 class="font-bold text-xl mb-4">
            Choose an Option
        </h3>

        <div class="space-y-4">

            <div
                onclick="showVirtualForm()"
                class="bg-white rounded-2xl p-5 shadow cursor-pointer border border-slate-200">

                <div class="flex items-center gap-4">

                    <div class="w-14 h-14 rounded-xl bg-blue-100 flex items-center justify-center">

                        <i class="fa-solid fa-id-card text-blue-700 text-2xl"></i>

                    </div>

                    <div>

                        <h4 class="font-bold">
                            Create Virtual ID
                        </h4>

                        <p class="text-sm text-slate-500">
                            Generate digital ID card
                        </p>

                    </div>

                </div>

            </div>

            <div
                onclick="showManualForm()"
                class="bg-white rounded-2xl p-5 shadow cursor-pointer border border-slate-200">

                <div class="flex items-center gap-4">

                    <div class="w-14 h-14 rounded-xl bg-green-100 flex items-center justify-center">

                        <i class="fa-solid fa-upload text-green-700 text-2xl"></i>

                    </div>

                    <div>

                        <h4 class="font-bold">
                            Add Existing ID
                        </h4>

                        <p class="text-sm text-slate-500">
                            Upload front and back photos
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- VIRTUAL ID FORM -->

    <div
        id="virtualSection"
        class="hidden">

        <div class="bg-white m-4 rounded-2xl shadow p-4">

            <h3 class="font-bold text-lg mb-4">
                Virtual ID Generator
            </h3>

            <select
                id="id-type"
                class="w-full border rounded-xl p-3 mb-3">

                <option value="national">
                    National ID
                </option>

                <option value="philhealth">
                    PhilHealth
                </option>

                <option value="sss">
                    SSS UMID
                </option>

                <option value="tin">
                    TIN ID
                </option>

                <option value="work">
                    Company ID
                </option>

                <option value="school">
                    School ID
                </option>

            </select>

            <input
                type="text"
                id="id-name"
                placeholder="Full Name"
                class="w-full border rounded-xl p-3 mb-3">

            <input
                type="text"
                id="id-number"
                placeholder="ID Number"
                class="w-full border rounded-xl p-3 mb-3">

            <input
                type="text"
                id="id-extra"
                placeholder="Additional Info"
                class="w-full border rounded-xl p-3 mb-3">

            <input
                type="file"
                id="id-photo"
                accept="image/*"
                class="w-full border rounded-xl p-3 mb-4">

            <button
                onclick="generateAndSaveID()"
                class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold">

                Generate & Save ID

            </button>

        </div>

    </div>

    <!-- MANUAL ID FORM -->

    <div
        id="manualSection"
        class="hidden">

        <div class="bg-white m-4 rounded-2xl shadow p-4">

            <h3 class="font-bold text-lg mb-4">
                Add Existing ID
            </h3>

            <select
                id="manual-type"
                class="w-full border rounded-xl p-3 mb-4">

                <option value="national">
                    National ID
                </option>

                <option value="philhealth">
                    PhilHealth
                </option>

                <option value="sss">
                    SSS UMID
                </option>

                <option value="tin">
                    TIN ID
                </option>

                <option value="work">
                    Company ID
                </option>

                <option value="school">
                    School ID
                </option>

            </select>

            <!-- CARD PREVIEW -->

            <div class="id-card-container mb-4">

                <div
                    id="previewCard"
                    class="id-card">

                    <div class="front">

                        <img
                            id="frontPreview"
                            src="">

                    </div>

                    <div class="back">

                        <img
                            id="backPreview"
                            src="">

                    </div>

                </div>

            </div>

            <button type="button"
                onclick="flipCard()"
                class="w-full bg-blue-600 text-white py-3 rounded-xl mb-4">

                <i class="fa-solid fa-repeat"></i>
                Flip ID

            </button>

            <!-- FRONT -->

            <h4 class="font-bold mb-2">
                Front Side
            </h4>

            <input
                type="file"
                id="frontInput"
                accept="image/*"
                onchange="previewFront(event)"
                class="w-full border rounded-xl p-3 mb-3">

            <div class="grid grid-cols-2 gap-2 mb-4">

                <button type="button"
                    onclick="document.getElementById('frontInput').click()"
                    class="bg-green-600 text-white py-3 rounded-xl">

                    Edit Front

                </button>

                <button type="button"
                    onclick="removeFront()"
                    class="bg-red-600 text-white py-3 rounded-xl">

                    Remove Front

                </button>

            </div>

            <!-- BACK -->

            <h4 class="font-bold mb-2">
                Back Side
            </h4>

            <input
                type="file"
                id="backInput"
                accept="image/*"
                onchange="previewBack(event)"
                class="w-full border rounded-xl p-3 mb-3">

            <div class="grid grid-cols-2 gap-2 mb-4">

                <button type="button"
                    onclick="document.getElementById('backInput').click()"
                    class="bg-green-600 text-white py-3 rounded-xl">

                    Edit Back

                </button>

                <button type="button"
                    onclick="removeBack()"
                    class="bg-red-600 text-white py-3 rounded-xl">

                    Remove Back

                </button>

            </div>

            <button type="button"
                onclick="saveManualID()"
                class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold">

                Save Existing ID

            </button>

        </div>

    </div>

</div>


<!-- SUCCESS MODAL -->

<div
id="successModal"
class="fixed inset-0 bg-black/60 hidden z-[9999] flex items-center justify-center p-6">

    <div class="bg-white w-full max-w-sm rounded-3xl p-6 text-center">

        <div class="w-20 h-20 mx-auto rounded-full bg-green-100 flex items-center justify-center mb-4">

            <i class="fa-solid fa-check text-4xl text-green-600"></i>

        </div>

        <h3 class="text-xl font-bold mb-2">
            Saved Successfully
        </h3>

        <p
        id="successMessage"
        class="text-slate-500 mb-5">

            Your ID has been added.

        </p>

        <button
        onclick="goToWallet()"
        class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold">

            View In Wallet

        </button>

    </div>

</div>



<script src="js/wallet.js"></script>
<script src="js/manual-id.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
