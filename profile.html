<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - MyWallet PH</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
tailwind.config = {
theme:{
extend:{
fontFamily:{
sans:['Plus Jakarta Sans','sans-serif']
},
colors:{
brand:{
700:'#334e68',
800:'#243b53',
900:'#102a43'
}
}
}
}
}
</script>

<style>
body{
font-family:'Plus Jakarta Sans',sans-serif;
}
</style>

</head>
<body class="bg-slate-50">

<div class="max-w-md mx-auto min-h-screen bg-white">

    <!-- Header -->
    <div class="p-4 flex items-center border-b border-slate-200 bg-white sticky top-0">
        <button onclick="history.back()"
            class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <h1 class="ml-4 font-bold text-lg text-brand-900">
            My Profile
        </h1>
    </div>

    <!-- Profile -->
    <div class="p-6">

        <div class="flex flex-col items-center">

            <label for="profileUpload" class="cursor-pointer">

                <img
                    id="profilePreview"
                    src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                    class="w-28 h-28 rounded-full object-cover border-4 border-white shadow-lg">

            </label>

            <input
                type="file"
                id="profileUpload"
                accept="image/*"
                class="hidden">

            <p class="text-xs text-slate-500 mt-3">
                Tap image to change profile photo
            </p>

        </div>

        <div class="mt-8">

            <label class="block text-sm font-bold mb-2">
                Full Name
            </label>

            <input
                type="text"
                id="profileName"
                placeholder="Enter your full name"
                class="w-full p-4 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-800">

        </div>

        <div class="mt-5">

            <label class="block text-sm font-bold mb-2">
                App User ID
            </label>

            <input
                type="text"
                id="userId"
                readonly
                class="w-full p-4 rounded-xl bg-slate-100 border border-slate-200">

        </div>

        <button
    onclick="saveProfile()"
    class="w-full mt-6 bg-brand-900 hover:bg-brand-800 text-white font-bold py-4 rounded-xl">

    Save Profile

</button>
        <!-- Success Modal -->
<div
id="successModal"
class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">

    <div class="bg-white rounded-3xl p-6 w-[90%] max-w-sm text-center shadow-2xl">

        <div class="w-20 h-20 mx-auto rounded-full bg-green-100 flex items-center justify-center">

            <i class="fa-solid fa-check text-4xl text-green-600"></i>

        </div>

        <h2 class="text-xl font-extrabold mt-4 text-slate-800">
            Profile Updated
        </h2>

        <p class="text-slate-500 text-sm mt-2">
            Your profile information has been updated successfully.
        </p>

        <button
        id="continueBtn"
        class="mt-5 w-full bg-brand-900 text-white py-3 rounded-xl font-bold">

            Continue

        </button>

    </div>

</div>

    </div>

</div>

<script>

const profileName = document.getElementById("profileName");
const profilePreview = document.getElementById("profilePreview");
const profileUpload = document.getElementById("profileUpload");
const userId = document.getElementById("userId");


document.addEventListener("DOMContentLoaded", () => {

    const savedName =
        localStorage.getItem("walletProfileName");

    const savedImage =
        localStorage.getItem("walletProfileImage");

    const savedUserId =
        localStorage.getItem("walletUserId");

    if(savedName){
        profileName.value = savedName;
    }

    if(savedImage){
        profilePreview.src = savedImage;
    }

    if(savedUserId){

        userId.value = savedUserId;

    }else{

        const generatedId =
            "MW-" +
            Math.random()
            .toString(36)
            .substring(2,10)
            .toUpperCase();

        localStorage.setItem(
            "walletUserId",
            generatedId
        );

        userId.value =
            generatedId;
    }

});


profileUpload.addEventListener(
"change",
function(e){

    const file =
        e.target.files[0];

    if(!file) return;

    const reader =
        new FileReader();

    reader.onload =
    function(event){

        profilePreview.src =
            event.target.result;

    };

    reader.readAsDataURL(file);

});



function saveProfile(){

    const name =
        profileName.value.trim();

    if(name === ""){

        alert("Please enter your name.");
        return;

    }

    localStorage.setItem(
        "walletProfileName",
        name
    );

    localStorage.setItem(
        "walletProfileImage",
        profilePreview.src
    );

    const modal =
        document.getElementById(
            "successModal"
        );

    modal.classList.remove(
        "hidden"
    );

    modal.classList.add(
        "flex"
    );

}
// Continue Button
document.getElementById("continueBtn").addEventListener(
    "click",
    function(){

        // Hide modal
        document
        .getElementById("successModal")
        .classList.add("hidden");

        document
        .getElementById("successModal")
        .classList.remove("flex");

        // Tell index.html to open Profile tab
        localStorage.setItem(
            "openProfileTab",
            "true"
        );

        // Go back to app
        window.location.href =
            "index.html";

    }
);
</script>

</body>
</html>
